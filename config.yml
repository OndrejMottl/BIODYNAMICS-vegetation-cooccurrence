default:
  target_store: default
  seed: 1234
  graphical:
    width: 2000
    height: 1600
    units: "px"
    dpi: 300
    bg: "white"
    panel_scale: 3.2
  data_processing:
    time_step: 500
    number_of_taxa: !expr Inf
    minimal_proportion_of_pollen: 0.01
    min_n_cores: 5
    n_cores: 12
    n_interpolation_workers: 4
    min_n_samples: 1
    min_n_taxa: 5
  model_fitting:
    n_cores: 5
    n_mev: 2
    n_iter: 500
    n_sampling: 200
    n_step_size: ~
    n_early_stopping: ~
    n_samples_anova: 1000
    error_family: "binomial"
    spatial_crs: 3035
    spatial_mode: "spatial"
    use_spatial: true
    use_age_in_formula: true
    age_scale_mode: "z_score"
    cross_validation:
      tier_id: "default"
      tuning_strategy: "exhaustive"
      staged_search:
        strategy_version: "sjsdm_staged_tuning_v1"
        repeat_order: !expr c(1L, 2L, 3L)
        survivor_counts: !expr c(4L, 2L)
      tuning_context:
        resolution_ids: ~
      common_regularization_sensitivity:
        enabled: false
        representative_scale_id: ~
      default_folds: 5
      assignment_repeats: 3
      assignment_seed: 900723
      fit_seed: 900723
      fit_device: "gpu"
      min_mem_locations: 4
      regularization:
        alpha_cov: !expr c(0.5)
        alpha_coef: !expr c(0.5)
        alpha_spatial: !expr c(0.5)
        lambda_cov: !expr c(0, 0.1)
        lambda_coef: !expr c(0, 0.1)
        lambda_spatial: !expr c(0, 0.1)
      selection_metric: "negative_log_likelihood_per_response"
      grid:
        target_locations_per_cell: 5
        size_multipliers: !expr 2^seq(-2, 3)
        occupancy_criterion: "median"
        lower_quantile_probability: 0.25
        max_fold_location_difference: 1
        max_fold_sample_difference: !expr Inf
project_cz_paleo:
  target_store: Data/targets/cz_paleo
  continent_id: "europe"
  vegvault_data:
    x_lim: !expr c(12, 18.9)
    y_lim: !expr c(48.5, 51.5)
    age_lim: !expr c(0, 5000)
    sel_dataset_type: !expr c("fossil_pollen_archive", "gridpoints")
    sel_abiotic_var_name: !expr c("bio1", "bio12")
  data_processing:
    taxonomic_resolution: "genus"
    min_n_samples: 5
    min_n_taxa: 4
    n_cores: 24
    n_interpolation_workers: 16
  model_fitting:
    n_mev: 3
    n_cores: 24
    n_iter: 500
    n_step_size: ~
    n_samples_anova: 100
    n_early_stopping: ~
    spatial_mode: "spatiotemporal"
    cross_validation:
      tier_id: "cz_paleo"
      tuning_strategy: "exhaustive"
      assignment_repeats: 1
      staged_search:
        repeat_order: !expr c(1L)
      regularization:
        alpha_cov: !expr c(0.5)
        alpha_coef: !expr c(0.5)
        alpha_spatial: !expr c(0.5)
        lambda_cov: !expr c(0)
        lambda_coef: !expr c(0)
        lambda_spatial: !expr c(0)
project_cz_paleo_cv_reference:
  inherits: project_cz_paleo
