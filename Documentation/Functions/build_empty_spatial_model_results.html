<h2>Build an Empty Spatial Model Result</h2>

<h3>Description</h3>

<p>Creates the typed zero-row schema returned when no model results can be
loaded.
</p>


<h3>Usage</h3>

<pre><code class='language-R'>.build_empty_spatial_model_results()
</code></pre>


<h3>Value</h3>

<p>A zero-row tibble with the spatial model result schema.
