# Human-authored configuration source.
# Regenerate config.yml; do not copy this fragment manually.

default:
  target_store: default
  seed: 1234
  graphical:
    width: 2000
    height: 1600
    units: "px"
    dpi: 300
    bg: "white"
    panel_scale: 3.2
  # Projection of spatial-predictor coordinates per continent (issue #204).
  #   Europe keeps ETRS89-LAEA; elsewhere the azimuthal equidistant
  #   projection centred on the continental grid box had the narrowest 5-95 %
  #   distance-distortion range (stage A projection diagnostic, Nov 2026).
  spatial_crs_by_continent:
    europe: 3035
    america: "+proj=aeqd +lat_0=50 +lon_0=-95 +datum=WGS84 +units=m +no_defs"
    asia: "+proj=aeqd +lat_0=62.5 +lon_0=100 +datum=WGS84 +units=m +no_defs"
  # The VegVault release that Data/Input/VegVault.sqlite must hold. The
  #   config_vegvault_release target stops when the file reports another
  #   version, so a database swap cannot pass unnoticed.
  vegvault_data:
    vegvault_version: "2.0.0"
  data_processing:
    time_step: 500
    number_of_taxa: !expr Inf
    minimal_proportion_of_pollen: 0.01
    min_n_cores: 5
    n_cores: 12
    n_interpolation_workers: 4
    min_n_samples: 1
    min_n_taxa: 5
  model_fitting:
    n_cores: 5
    n_mev: 2
    n_iter: 500
    n_sampling: 200
    n_step_size: ~
    n_early_stopping: ~
    n_samples_anova: 1000
    error_family: "binomial"
    # Superseded by spatial_crs_by_continent for projected coordinates; kept
    #   unchanged until the next full rerun because config_model_fitting
    #   carries it and changing it would invalidate every model store.
    spatial_crs: 3035
    spatial_mode: "spatial"
    spatial_mev:
      strategy: "auto"
      exact_max_locations: 1999
      fast_eigenvectors: 200
      fast_seed: 900723
      projection_chunk_size: 5000
    use_spatial: true
    use_age_in_formula: true
    age_scale_mode: "z_score"
    cross_validation:
      tier_id: "default"
      fit_budget:
        n_iter_initial: 500
        n_iter_max: 2000
        n_sampling: 200
        n_step_size: ~
        n_early_stopping: ~
      tuning_strategy: "staged"
      staged_search:
        strategy_version: "sjsdm_staged_tuning_v1"
        repeat_order: !expr c(1L, 2L, 3L)
        survivor_counts: !expr c(4L, 2L)
      tuning_context:
        resolution_ids: ~
      common_regularization_sensitivity:
        enabled: false
        representative_scale_id: ~
      default_folds: 5
      grouped_fold_ladder: !expr c(5L, 10L, 20L, 50L)
      assignment_repeats: 3
      assignment_seed: 900723
      fit_seed: 900723
      fit_device: "gpu"
      min_mem_locations: 4
      regularization:
        alpha_cov: !expr c(0.5)
        alpha_coef: !expr c(0.5)
        alpha_spatial: !expr c(0.5)
        lambda_cov: !expr c(0, 0.1)
        lambda_coef: !expr c(0, 0.1)
        lambda_spatial: !expr c(0, 0.1)
      selection_metric: "negative_log_likelihood_per_response"
      grid:
        target_locations_per_cell: 5
        size_multipliers: !expr 2^seq(-2, 3)
        occupancy_criterion: "median"
        lower_quantile_probability: 0.25
        max_fold_location_difference: 1
        max_fold_sample_difference: !expr Inf
  _profile:
    role: base
    status: active
    selectable: false
    pipeline: shared
    description: "Shared defaults inherited by project profiles."
    related_issue: ~
    retirement: ~
    supported_runners:
      []
