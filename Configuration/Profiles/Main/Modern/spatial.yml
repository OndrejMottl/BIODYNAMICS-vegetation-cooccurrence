# Human-authored configuration source.
# Regenerate config.yml; do not copy this fragment manually.

project_modern_spatial_continental:
  target_store: Data/targets/modern_spatial_continental
  vegvault_data:
    age_lim: !expr c(0, 0)
    sel_dataset_type: !expr c("vegetation_plot", "gridpoints")
    sel_abiotic_var_name: !expr c("bio1", "bio4", "bio6", "bio12", "bio15", "bio18", "bio19")
  data_processing:
    taxonomic_resolution: "genus"
    min_n_samples: 10
    min_n_taxa: 5
  model_fitting:
    model_tuning_id: "modern_spatial"
    cross_validation:
      tier_id: "modern_spatial_continental"
      common_regularization_sensitivity:
        enabled: true
        representative_scale_id: "europe"
    use_age_in_formula: false
    use_spatial: true
    spatial_mode: "spatial"
    n_mev: 5
    n_cores: 24
  _profile:
    role: main
    status: active
    selectable: true
    pipeline: modern_spatial
    description: "Main continental modern-spatial analysis."
    related_issue: ~
    retirement: ~
    supported_runners:
      - R/02_Main_analyses/01_Spatial/02_Contemporary/01_Run_modern_continental.R

