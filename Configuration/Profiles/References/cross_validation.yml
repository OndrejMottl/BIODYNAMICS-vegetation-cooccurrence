project_cz_paleo_cv_reference:
  inherits: project_cz_paleo
  target_store: Data/targets/cz_paleo_cv_reference
  model_fitting:
    model_tuning_id: paleo_core
    cross_validation:
      tier_id: "cz_paleo_cv_reference"
      assignment_repeats: 3
      regularization:
        lambda_cov: !expr c(0, 0.1)
        lambda_coef: !expr c(0, 0.1)
