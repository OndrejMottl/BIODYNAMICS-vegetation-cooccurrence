project_issue138_paleo_spatial_continental_europe_staged:
  inherits: project_paleo_spatial_continental
  target_store: Data/targets/issue138_validation/paleo_continental_europe
  data_processing:
    n_interpolation_workers: 4
  model_fitting:
    cross_validation:
      tier_id: "issue138_paleo_continental_europe"
      tuning_strategy: "staged"
      tuning_context:
        resolution_ids: !expr c("genus")
  _profile:
    role: one_time
    status: frozen
    selectable: false
